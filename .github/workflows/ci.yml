name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate workspace manifest
        run: cargo metadata --format-version 1 --no-deps

      - name: Detect Rust packages
        id: packages
        shell: bash
        run: |
          if find . -mindepth 2 -name Cargo.toml -not -path './target/*' | grep -q .; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        if: steps.packages.outputs.has_packages == 'true'
        run: cargo fmt --all -- --check

      - name: Cargo check
        if: steps.packages.outputs.has_packages == 'true'
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        if: steps.packages.outputs.has_packages == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.packages.outputs.has_packages == 'true'
        run: cargo test --workspace --all-features

      - name: Release build
        if: steps.packages.outputs.has_packages == 'true'
        run: cargo build --workspace --release

      - name: Validate generated LLVM IR
        if: steps.packages.outputs.has_packages == 'true'
        run: |
          target/release/lyra --emit-llvm examples/native_exit.ly > /tmp/lyra-native-exit.ll
          clang -x ir -fsyntax-only /tmp/lyra-native-exit.ll

      - name: Build and execute native Lyra program
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          target/release/lyra build examples/native_exit.ly -o /tmp/lyra-native-exit
          set +e
          /tmp/lyra-native-exit
          code=$?
          set -e
          test "$code" -eq 42

      - name: Build and execute native Lyra function call
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          target/release/lyra build examples/function_call.ly -o /tmp/lyra-function-call
          set +e
          /tmp/lyra-function-call
          code=$?
          set -e
          test "$code" -eq 42

      - name: Build and execute typed native Lyra function call
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          target/release/lyra build examples/typed_function_call.ly -o /tmp/lyra-typed-function-call
          set +e
          /tmp/lyra-typed-function-call
          code=$?
          set -e
          test "$code" -eq 42

      - name: Build and execute native Lyra conditional
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          target/release/lyra build examples/if_else.ly -o /tmp/lyra-if-else
          set +e
          /tmp/lyra-if-else
          code=$?
          set -e
          test "$code" -eq 42

      - name: Build and execute native Lyra while loop
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          target/release/lyra build examples/while_loop.ly -o /tmp/lyra-while-loop
          set +e
          /tmp/lyra-while-loop
          code=$?
          set -e
          test "$code" -eq 42

      - name: Build and execute stateful native Lyra while loop
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          target/release/lyra build examples/mutable_while.ly -o /tmp/lyra-mutable-while
          set +e
          /tmp/lyra-mutable-while
          code=$?
          set -e
          test "$code" -eq 42
